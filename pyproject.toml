[project]
name = "deep-research-agent"
version = "1.0.0"
description = "Autonomous multi-agent deep research and report generation engine built on LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "langgraph==0.2.62",
    "langchain-core==0.3.28",
    "litellm==1.57.0",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
frontend = ["streamlit==1.41.1"]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.2"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
